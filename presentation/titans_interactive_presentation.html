<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITANS: Library Management System</title>
<style>
:root{--bg:#0B1020;--sf:#131B2E;--tx:#F4F7FB;--mu:#A7B2C8;--cy:#55DDE0;--vi:#8B7CFF;--am:#FFC66D;--ln:#2a3552}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#05070f;color:var(--tx);font:17px/1.45 Inter,Manrope,"Segoe UI",system-ui,sans-serif}
#st{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.sl{position:absolute;inset:0;padding:52px 72px 70px;opacity:0;visibility:hidden;transition:opacity .25s}.sl.on{opacity:1;visibility:visible}
h1{font-size:104px;letter-spacing:.04em;line-height:1}h2{font-size:34px;line-height:1.15;margin-bottom:22px;max-width:1000px}h3{font-size:19px;margin-bottom:6px}
.mu{color:var(--mu)}.cy{color:var(--cy)}.vi{color:var(--vi)}.am{color:var(--am)}.sm{font-size:14px}.tx{font-size:20px}
.rv{opacity:0;transform:translateY(8px);transition:.3s}.rv.sh{opacity:1;transform:none}
.g{display:grid;gap:18px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.p{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px 20px}
.b{font:inherit;font-size:15px;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer}.b:hover,.b:focus-visible{border-color:var(--cy);outline:none}.b.a{border-color:var(--cy);color:var(--cy)}
.nd{background:var(--sf);border:2px solid var(--cy);border-radius:10px;width:112px;padding:8px;text-align:center;cursor:pointer;transition:.25s}.nd .v{font-size:24px;font-weight:700}.nd i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.nd.s{border-color:var(--vi);box-shadow:0 0 0 3px #8b7cff44}.nd.c{background:#55dde022}.nd.m{background:#55dde033;border-color:var(--cy)}.nd.x{opacity:.35;border-color:var(--ln)}.nd.go{opacity:0;transform:scale(.6)}
.nd i.ch{color:var(--am);font-weight:700}.ar{color:var(--cy);font-size:22px}.tg{display:block;text-align:center;font-size:13px;color:var(--am);height:18px}
.lay{border-left:6px solid var(--vi);cursor:pointer;margin-bottom:10px}.lay.a{border-color:var(--cy);background:#1b2742}
.st{display:flex;gap:12px;align-items:center;padding:9px 14px;border-radius:8px;border:1px solid var(--ln);margin-bottom:8px;color:var(--mu)}.st.ok{border-color:var(--cy);color:var(--tx)}.st.bad{border-color:var(--am);color:var(--am)}.st.skip{opacity:.4}
.big{font-size:60px;font-weight:700;color:var(--cy);line-height:1}.bar{height:10px;border-radius:5px;background:var(--cy)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:8px;font-size:14px;color:var(--mu)}
#pg{position:fixed;left:0;top:0;height:3px;background:var(--cy);transition:width .25s}
#nt,#ov{position:fixed;display:none;background:#0B1020ee;border:1px solid var(--ln);border-radius:12px;padding:16px 20px}#nt{left:20px;right:20px;bottom:52px;font-size:16px}#ov{inset:24px;overflow:auto}
#ov.on,#nt.on{display:block}#ov .g{grid-template-columns:repeat(4,1fr)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ed{stroke:var(--cy);stroke-width:1.5;opacity:.6}.on .ed{stroke-dasharray:300;animation:dr 1.2s ease-out both}@keyframes dr{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
</style></head><body><noscript><style>.rv{opacity:1}.sl{position:static;opacity:1;visibility:visible;height:auto}#st{position:static;transform:none}html,body{overflow:auto}</style></noscript>
<div id="pg"></div><div id="st"></div>
<div id="nt"></div><div id="ov"></div>
<div id="nav"><button class="b" onclick="go(-1)" aria-label="Previous">◀</button><span id="ct"></span><button class="b" onclick="go(1)" aria-label="Next">▶</button><button class="b" onclick="ov()">Overview (O)</button><button class="b" onclick="nt()">Notes (N)</button><button class="b" onclick="fs()">Full screen (F)</button></div>
<script>
const $=s=>document.querySelector(s),Q=(s,f)=>document.querySelectorAll(s).forEach(f);
const lbl=t=>`<p class="sm mu" style="margin-top:12px">${t}</p>`;
const CON=lbl("Conceptual JavaScript demonstration, not the C++ program running.");
// ---- data
const LY=[["UI","ConsoleApp · InputReader · Table","Talks to the user","ConsoleApp.cpp, InputReader.cpp, Table.cpp","Gets menu input and delegates every action to LibraryService","SQL, node pointers, business rules"],
["Service","LibraryService · search and sort strategies","Applies the business rules","LibraryService.cpp, SearchStrategy.cpp, SortStrategy.cpp","Gets requests from the UI; uses Domain, Container and the repository interface","Console I/O, SQL text"],
["Domain","Book · Member","Entities and their invariants","Book.cpp, Member.cpp","Gets values and validates them","Storage, UI"],
["Core","Container&lt;T&gt;","Generic doubly linked list","core/Container.h","Stores, links, iterates and sorts any element type","Knowing what a book is"],
["Repository","ILibraryRepository · SqliteRepository · NullRepository","Persistence behind an interface","ILibraryRepository.h, SqliteRepository.cpp, NullRepository.h","Gets write commands from the service; saves to SQLite or does nothing","Business rules"]];
const PT={Strategy:["Different search and sort behaviour behind one interface.","ISearchStrategy, ISortStrategy: TitleSearch, AuthorSearch, IsbnSearch, GenreSearch, TitleSort, AuthorSort, GenreSort","Service"],
Facade:["The UI needs one simple entry point; rules live in one place.","LibraryService hides Domain, Container, strategies and storage","Service"],
Repository:["Service logic must not depend on SQLite.","ILibraryRepository with SqliteRepository behind it","Repository"],
Factory:["Creates the requested strategy from a text token.","SortStrategyFactory, SearchStrategyFactory","Service"],
Iterator:["Walk the list without exposing nodes.","BasicIterator, Iterator, ConstIterator in Container.h","Core"],
"Null Object":["No null checks when persistence is not needed.","NullRepository: a no-op repository","Repository"],
"Command / Dispatch":["Maps a menu number to an action.","std::vector&lt;MenuEntry&gt; dispatch table in ConsoleApp.cpp","UI"]};
const BK=[["Clean Code","Robert C. Martin","Software","ISBN-1"],["Cosmos","Carl Sagan","Science","ISBN-2"],["Emma","Jane Austen","Fiction","ISBN-3"],["A Brief History of Time","Stephen Hawking","Science","ISBN-4"],["The Selfish Gene","Richard Dawkins","Science","ISBN-5"]];
const CR={Title:["time","contains, ignoring case",b=>b[0].toLowerCase().includes("time")],Author:["sagan","contains, ignoring case",b=>b[1].toLowerCase().includes("sagan")],ISBN:["ISBN-4","normalized exact match",b=>b[3]=="ISBN-4"],Genre:["Science","whole-field match",b=>b[2]=="Science"]};
const WF=["Read ISBN and member ID","Normalize and find the entities","Check the book is available","Enforce the 5-book limit","Persist the loan (repository)","Update Member and Book in memory"];
const SC={ok:[-1,"Success: the in-memory state changed only after the write succeeded."],unk:[1,"Unknown entity: rejected, nothing changed."],bor:[2,"Book already on loan: rejected, nothing changed."],lim:[3,"Member already holds 5 books: rejected, nothing changed."],db:[4,"Database error: exception thrown before memory is touched, state unchanged."]};
const SCN={ok:"Success",unk:"Unknown entity",bor:"Already borrowed",lim:"Limit reached",db:"Database failure"};
const MS=[[["D","B","A","C"]],[["D","B"],["A","C"]],[["B","D"],["A","C"]],[["A","B","C","D"]]];
const MT=["Unsorted list","Split into halves","Sort each half (recursively)","Merge: always take the smaller front node. Nodes are relinked, not copied."];
// ---- slides
const S=[
[`TITANS`,`<svg viewBox="0 0 640 340" style="position:absolute;right:50px;top:90px;width:560px"><g>${[[0,1],[1,2],[2,3],[3,4],[1,3],[2,5],[5,6],[6,1],[0,4]].map(e=>{const P=[[90,120],[250,50],[400,140],[330,260],[130,290],[520,270],[580,90]];return`<line class="ed" x1="${P[e[0]][0]}" y1="${P[e[0]][1]}" x2="${P[e[1]][0]}" y2="${P[e[1]][1]}"/>`}).join("")}${[[90,120],[250,50],[400,140],[330,260],[130,290],[520,270],[580,90]].map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i%3?9:14}" fill="#131B2E" stroke="${i%3?"#55DDE0":"#8B7CFF"}" stroke-width="2.5"/>`).join("")}</g></svg><div style="position:absolute;left:72px;top:210px"><h1>TITANS</h1><p style="font-size:36px;margin:8px 0 14px">Library Management System</p><p class="cy tx">C++17 · Data Structures · Algorithms · Software Engineering</p><p class="mu" style="margin-top:80px">Mazen Elsayed · Zagazig National University · AI &amp; Data Science</p></div>`,"A library system built from the inside out: the interesting part is the engineering under the menus."],
[`More than a list of books: the catalogue has to stay consistent`,`<div class="g" style="grid-template-columns:1fr 60px 1fr;align-items:center;margin-top:20px"><div style="position:relative;height:330px">${["Who has Dune?","two copies, same ISBN?","returned... maybe","find by author","lost the list"].map((t,i)=>`<div class="p mu sm" style="position:absolute;left:${(i*83)%230}px;top:${i*62}px;transform:rotate(${i*5-9}deg);width:230px">${t}</div>`).join("")}</div><div class="cy" style="font-size:40px">→</div><div>${["One consistent catalogue","Borrowing and returns tracked","No duplicates or invalid states","Search and sort","Saved persistently"].map(t=>`<div class="p rv tx" style="margin-bottom:10px;border-left:5px solid var(--cy)">${t}</div>`).join("")}</div></div>`,"Keep it short: the engineering challenge is consistency, not libraries as a social problem. Advance to reveal the five goals."],
[`What the application does today: a console app with SQLite`,`<div class="g" style="grid-template-columns:1fr 1fr;margin-top:6px"><div class="p" style="font-family:ui-monospace,Consolas,monospace;font-size:15px;line-height:1.5"><span class="cy">Main menu</span><br> 1 List all books<br> 2 Add a book<br> 3 Remove a book<br> 4 Search books<br> 5 Borrow a book<br> 6 Return a book<br> 7 Sort the catalog<br> 8 Statistics<br> 9 Members<br>10 Load sample data<br> 0 Exit${lbl("Menu text taken from the README sample session.")}</div><div>${["Manage books and members","Search by title, author, ISBN or genre","Borrow and return books","Sort by title, author or genre","View library statistics","Store records in SQLite"].map(t=>`<div class="p rv tx" style="margin-bottom:10px">${t}</div>`).join("")}</div></div>`,"Orientation only. Live behaviour is shown in the terminal demo."],
[`Five layers, one clear direction of dependency`,`<div class="g" style="grid-template-columns:480px 1fr"><div>${LY.map((l,i)=>`<div class="p lay${i?"":" a"}" tabindex="0" onclick="ly(${i})" onkeydown="if(event.key=='Enter')ly(${i})"><b>${l[0]}</b><div class="sm mu">${l[1]}</div></div>`).join("")}</div><div class="p" id="ld" style="min-height:430px"></div></div>${lbl("Select a layer. The UI talks to the service API, never to SQL or node pointers.")}`,"Click each layer. Stress that dependencies point downward and that Service is the only door into the logic."],
[`<span class="cy">Container&lt;T&gt;</span>: a custom generic doubly linked list`,`<div class="p" style="margin-bottom:16px;padding-top:30px"><div class="row" id="ll" style="justify-content:center;min-height:100px;flex-wrap:nowrap"></div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="am" id="sz"></span><span class="sm mu" id="lm"></span></div></div><div class="row"><button class="b" onclick="L('pf')">push_front</button><button class="b" onclick="L('pb')">push_back</button><button class="b" onclick="L('rm')">remove selected</button><button class="b" onclick="L('f')">Forward ▶</button><button class="b" onclick="L('bk')">◀ Backward</button><button class="b" onclick="L('r')">Reset</button></div><div class="g" style="grid-template-columns:repeat(3,1fr);margin-top:16px"><div class="p sm"><b class="am">head_ / tail_</b><br>Entry points to the first and last node.</div><div class="p sm"><b class="am">size_</b><br>Element count kept in O(1).</div><div class="p sm"><b class="am">prev / next</b><br>First node's prev and last node's next are nullptr.</div></div>${CON}`,"Click a node to select it, then try removing it. Notice head_ and tail_ move when the ends change."],
[`Deleting a middle node means rewiring two pointers`,`<div class="row" id="ul" style="justify-content:center;gap:30px;margin:20px 0;min-height:130px"></div><p class="tx" id="um" style="text-align:center;min-height:30px"></p><div class="row" style="justify-content:center;margin:14px 0"><button class="b" onclick="U(1)">Next step ▶</button><button class="b" onclick="U(-9)">Reset</button></div><div class="p am rv" style="text-align:center;border-color:var(--am)">Unlinking a known node is O(1). Finding the book by ISBN first is still O(n).</div>`,"Three separate operations. Be precise: remove_book in LibraryService is O(b + m), because it searches first."],
[`What a linked container gives us, and what it costs`,`<div class="g" style="grid-template-columns:1.4fr 1fr"><div>${[["push_front / push_back","O(1)",8,"cy"],["Unlink a known node","O(1)",8,"cy"],["Insert / remove by index","O(n)",50,"am"],["Search / find","O(n)",50,"am"],["Merge sort","O(n log n)",72,"vi"],["Insertion sort","O(n²) worst · O(n) best",96,"am"]].map(r=>`<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><span>${r[0]}</span><b class="${r[3]}">${r[1]}</b></div><div class="bar" style="width:${r[2]}%;background:var(--${r[3]})"></div></div>`).join("")}${lbl("Bar length is schematic. Index operations need traversal first.")}</div><div class="p"><h3 class="cy">Why build it?</h3><p class="mu">Control over nodes, iterators, relinking, sorting, and stable node references.</p><h3 class="am" style="margin-top:14px">Honest trade-off</h3><p class="mu">std::vector wins on random access. std::list already exists. This is a learning and control decision, not proof a custom list is always better.</p></div></div>`,"Be candid. The README benchmark shows traversal and allocation timings equivalent to std::list; the point is control and understanding."],
[`Linear search: the iterator visits nodes, a strategy decides`,`<div class="row" id="sc"></div><div class="row" id="sr" style="justify-content:center;margin:26px 0 12px"></div><p class="tx" id="sm" style="min-height:30px"></p><div class="row"><button class="b" onclick="Z(1)">Next node ▶</button><button class="b" onclick="Z(9)">Run all</button><button class="b" onclick="Z(0)">Reset</button></div><div class="row mu sm" style="margin-top:14px"><span>TitleSearch · AuthorSearch · IsbnSearch · GenreSearch</span><span class="cy">Time O(n) · result storage O(r)</span></div>${lbl("Illustrative data, not the sample dataset.")}`,"Pick a criterion, then step. The strategy only answers yes or no for each book."],
[`Merge sort suits a linked list: it relinks nodes`,`<div class="g" style="grid-template-columns:1.3fr 1fr"><div class="p"><div class="row" id="ms" style="justify-content:center;gap:40px;min-height:110px"></div><p class="tx" id="mt" style="margin:14px 0;min-height:56px"></p><div class="row"><button class="b" onclick="M(1)">Next step ▶</button><button class="b" onclick="M(-9)">Reset</button></div>${CON}</div><div><div class="p" style="margin-bottom:12px"><b class="cy">Merge sort</b><br>O(n log n) time · O(log n) stack · stable · no node allocation</div><div class="p"><b class="am">Insertion sort</b><br>O(n) best · O(n²) worst · O(1) extra space</div></div></div>`,"The point: nodes are relinked, so no book is copied or reallocated. Stability keeps earlier title order when sorting by genre."],
[`Each pattern has a job; three carry the design`,`<div class="row" style="margin-bottom:14px">${["Strategy","Facade","Repository"].map(k=>`<button class="b" style="font-size:20px;padding:14px 26px" onclick="P('${k}')" id="p-${k}">${k}</button>`).join("")}</div><div class="row" style="margin-bottom:20px">${["Factory","Iterator","Null Object","Command / Dispatch"].map(k=>`<button class="b sm" onclick="P('${k}')" id="p-${k}">${k}</button>`).join("")}</div><div class="p" id="pd" style="min-height:190px"></div>`,"Strategy, Facade and Repository are the story. The others are supporting patterns, each with a concrete class in the repo."],
[`SQLite keeps state; availability is derived, never stored`,`<div class="g" style="grid-template-columns:1fr 1fr 1.3fr"><div class="p"><b class="cy">books</b><br class="sm"><span class="sm mu">isbn (PK, unique)<br>title<br>author<br>genre</span></div><div class="p"><b class="cy">members</b><br><span class="sm mu">id (PK)<br>name</span></div><div class="p" style="border-color:var(--vi)"><b class="vi">loans</b> <span class="sm mu">book_isbn FK · member_id FK<br>borrowed_at · returned_at</span><div class="row" style="margin-top:10px"><button class="b sm" onclick="D(0)">returned_at IS NULL</button><button class="b sm" onclick="D(1)">returned_at set</button></div></div></div><p class="tx" id="dm" style="margin:18px 0;min-height:56px"></p><div class="g" style="grid-template-columns:repeat(3,1fr)"><div class="p sm">Unique ISBNs and member IDs</div><div class="p sm">Foreign key constraints</div><div class="p sm">Partial unique index: at most one open loan per book</div></div>${lbl("All queries use parameterized binding (sqlite3_bind_*), preventing SQL injection.")}`,"Availability = no open loan. That is why a book cannot be borrowed twice: the database itself refuses a second open loan."],
[`Borrowing: validate, persist, then update memory`,`<div class="g" style="grid-template-columns:1fr 1fr"><div id="wf"></div><div><div class="row" id="ws" style="margin-bottom:14px"></div><div class="row"><button class="b" onclick="W(1)">Next step ▶</button><button class="b" onclick="W(0)">Reset</button></div><p class="tx" id="wm" style="margin:16px 0;min-height:60px"></p><div class="p am sm" style="border-color:var(--am)">The database write must succeed before in-memory state changes.</div><p class="sm mu" style="margin-top:12px">Invariants: unique ISBNs and IDs · one open loan per book · at most 5 books per member · borrowed books cannot be removed. Rare caveat: std::bad_alloc after a successful write.</p></div></div>${CON}`,"Choose a scenario and step through it. Rejections stop at the exact step that detects them."],
[`Reliability is measured, not assumed`,`<div class="g" style="grid-template-columns:repeat(4,1fr);margin:10px 0 22px">${[["189","test cases"],["209,475","assertions"],["0","failures"],["3,000","randomized operations"]].map(s=>`<div class="p rv"><div class="big" style="font-size:${s[0].length>4?42:60}px">${s[0]}</div><div class="mu">${s[1]}</div></div>`).join("")}</div><div class="g" style="grid-template-columns:1fr 1fr"><div class="p rv sm">Covered: container and iterators · search and sort · domain rules and service · SQLite persistence and open-loan recovery · UI and input scenarios</div><div class="p rv sm">README reports tests run under doctest and AddressSanitizer. This is not a claim of full code coverage.</div></div>`,"Numbers are from the repository README. If asked about coverage: we do not claim a measured percentage."],
[`Live demo: let the system prove it`,`<div class="g" style="grid-template-columns:1fr 1fr;margin-top:10px">${["Load sample data","Check statistics","Search “Clean Code”","Borrow it for a member","Borrow it again: rejected","Restart on the same database file","Return it: availability restored","Sort the catalog"].map((t,i)=>`<div class="p rv tx" style="border-left:5px solid var(--${i==4?"am":"cy"})"><span class="mu">${i+1}</span>&nbsp; ${t}</div>`).join("")}</div>${lbl("Agenda only. The demo itself runs in the real terminal; use --db &lt;file&gt; for the persistence step.")}`,"Advance one milestone at a time while running the real program in the terminal."],
[`Challenges solved, limits stated, next steps chosen`,`<div class="g" style="grid-template-columns:1.3fr 1fr 1fr"><div class="p rv"><h3 class="cy">Challenge → solution</h3><p class="sm mu">Consistency → centralized invariants, write before memory<br>Pointer safety → centralized relinking, edge-case tests<br>Extensible search/sort → strategies and factories<br>Resource lifetime → RAII<br>Ownership → explicit copy and move</p></div><div class="p rv"><h3 class="am">Current limits</h3><p class="sm mu">Console only<br>Single-user, single-threaded<br>No due dates or fines<br>Sort order not persisted<br>No ISBN checksum check</p></div><div class="p rv"><h3 class="vi">Next</h3><p class="sm mu">GUI on the same service layer<br>Authentication and roles<br>Due dates and fines<br>Backup and migrations<br>Deliberate concurrency design</p></div></div>`,"Examiners respect honest limits. Separate what exists from what is proposed."],
[`A library application built to show the engineering behind the interface`,`<div class="row" style="margin:10px 0 40px">${["Doubly linked Container&lt;T&gt;","Bidirectional iterators","Search, merge sort, insertion sort","Strategy · Facade · Repository","SQLite and business invariants","Automated tests"].map(t=>`<span class="p rv" style="border-radius:30px;padding:10px 20px">${t}</span>`).join("")}</div><p style="font-size:64px;font-weight:700" class="cy">Questions &amp; Discussion</p>`,"Close with the one-line message, then open the floor."]];
// ---- engine
let cur=0,nt0=0;const st=$("#st");
st.innerHTML=S.map((s,i)=>`<section class="sl" id="s${i}" aria-label="Slide ${i+1}">${i?`<h2>${s[0]}</h2>`:""}${s[1]}</section>`).join("");
function fit(){const k=Math.min(innerWidth/1280,(innerHeight-40)/720);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${Math.max(0,(innerHeight-40-720*k)/2)}px) scale(${k})`}
function show(i){cur=Math.max(0,Math.min(S.length-1,i));Q(".sl",e=>e.classList.remove("on"));$("#s"+cur).classList.add("on");$("#ct").textContent=`${cur+1} / ${S.length}`;$("#pg").style.width=(cur+1)/S.length*100+"%";$("#nt").textContent=S[cur][2];location.hash=cur+1}
function go(d){const sl=$("#s"+cur);if(d>0){const r=sl.querySelector(".rv:not(.sh)");if(r){r.classList.add("sh");return}}if(d<0)sl.querySelectorAll(".rv").forEach(e=>e.classList.add("sh"));if(d>0||d<0)show(cur+d)}
function ov(){const o=$("#ov");o.innerHTML=`<div class="g">${S.map((s,i)=>`<button class="b" style="text-align:left;padding:14px" onclick="show(${i});ov()"><span class="cy">${i+1}</span> ${s[0].replace(/<[^>]+>/g,"")}</button>`).join("")}</div>`;o.classList.toggle("on")}
function nt(){$("#nt").classList.toggle("on")}function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
addEventListener("keydown",e=>{if(e.target.tagName=="BUTTON"&&e.key==" ")return;const k=e.key;if(k=="ArrowRight"||k==" "||k=="PageDown"){e.preventDefault();go(1)}else if(k=="ArrowLeft"||k=="PageUp")go(-1);else if(k=="Home")show(0);else if(k=="End")show(S.length-1);else if(k=="o"||k=="O")ov();else if(k=="n"||k=="N")nt();else if(k=="f"||k=="F")fs();else if(k=="Escape"){$("#ov").classList.remove("on");$("#nt").classList.remove("on")}});
addEventListener("resize",fit);
// ---- interactions
